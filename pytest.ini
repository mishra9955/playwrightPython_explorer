[pytest]
testpaths = tests
addopts =
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --video retain-on-failure
    --output reports/test-results
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: quick critical-path checks
    regression: full regression suite
    selfcheck: framework sanity checks (no application needed)
    tc(id): link to the manual test case ID, e.g. @pytest.mark.tc("TC001")
    serial: mutates shared configuration - must not run in parallel
